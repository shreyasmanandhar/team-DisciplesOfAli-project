<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Hide & Seek</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 20px;
    margin: 0;
  }
  h1, h2 {
    text-align: center;
    color: #333;
  }
  .container {
    max-width: 600px;
    margin: auto;
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  form {
    display: flex;
    flex-direction: column;
  }
  label {
    margin-top: 12px;
    font-weight: bold;
  }
  input, textarea, select, button {
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  button {
    margin-top: 16px;
    background-color: #4c5e52;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
  }
  button:hover {
    background-color: #87a791;
    transform: translateY(-2px);
    box-shadow:0 8px 16px rgba(0, 0, 0, 0.3);
  }
  ul {
    padding-left: 0;
    list-style: none;
  }
  li {
    margin: 6px 0;
  }
  .hidden { display: none; }
  .player-item {
    padding: 8px;
    background: #eef2f0;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .found { text-decoration: line-through; color: gray; }
</style>
</head>
<body>

<div class="container" id="playerInputSection">
  <h1>Player Info Input</h1>
  <form id="playerForm">
    <label for="name">Player Name:</label>
    <input type="text" id="name" required placeholder="Your name">

    <label for="hints">Appearance Hints:</label>
    <textarea id="hints" required placeholder="Clothes, color, height..."></textarea>

    <label for="location">Location:</label>
    <select id="location" required>
      <option value="">--Select--</option>
      <option value="Library">Library</option>
      <option value="Cafeteria">Cafeteria</option>
      <option value="Bus Stop">Bus Stop</option>
      <option value="Campus Lawn">Campus Lawn</option>
    </select>

    <label for="time">Estimated Play Time (minutes):</label>
    <select id="time" required>
      <option value="">--Select--</option>
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="15">15</option>
    </select>

    <button type="submit">Add Player</button>
  </form>
  <p id="playerCount">Players Added: 0</p>
  <button id="goToLobbyBtn">Go to Lobby</button>
</div>

<div class="container hidden" id="lobbySection">
  <h1>Lobby</h1>
  <ul id="playerList"></ul>
  <button id="assignRolesBtn">Assign Roles</button>
  <button id="startGameBtn">Go to Finder</button>
  <p id="lobbyStatus"></p>
</div>

<div class="container hidden" id="finderSection">
  <h1>Finder</h1>
  <p id="targetHints"></p>
  <ul id="hiderList"></ul>
  <p id="finderStatus"></p>
  <h2>Game History</h2>
  <ul id="gameHistory"></ul>
</div>

<script>
let allPlayers = JSON.parse(localStorage.getItem("players")) || [];
let gameHistory = JSON.parse(localStorage.getItem("gameHistory")) || [];

// --- PLAYER INPUT SECTION ---
const playerForm = document.getElementById("playerForm");
const playerCount = document.getElementById("playerCount");
const goToLobbyBtn = document.getElementById("goToLobbyBtn");

function updatePlayerCount() {
    playerCount.textContent = `Players Added: ${allPlayers.length}`;
}
updatePlayerCount();

playerForm.addEventListener("submit", function(e){
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const hints = document.getElementById("hints").value.trim();
    const location = document.getElementById("location").value;
    const time = document.getElementById("time").value;

    if(!name || !hints || !location || !time) return alert("Fill all fields");

    const newPlayer = {
        id: Date.now().toString(),
        name, hints, location, time, role: null, targetId: null
    };

    allPlayers.push(newPlayer);
    localStorage.setItem("players", JSON.stringify(allPlayers));
    updatePlayerCount();
    playerForm.reset();
});

goToLobbyBtn.addEventListener("click", () => {
    if(allPlayers.length === 0) return alert("Add at least one player!");
    document.getElementById("playerInputSection").classList.add("hidden");
    document.getElementById("lobbySection").classList.remove("hidden");
    renderLobby();
});

// --- LOBBY SECTION ---
const playerList = document.getElementById("playerList");
const assignRolesBtn = document.getElementById("assignRolesBtn");
const startGameBtn = document.getElementById("startGameBtn");
const lobbyStatus = document.getElementById("lobbyStatus");

function renderLobby(){
    playerList.innerHTML = "";
    allPlayers.forEach(p => {
        const li = document.createElement("li");
        li.className = "player-item";
        li.textContent = `${p.name} | Location: ${p.location} | Time: ${p.time}min | Role: ${p.role || "Unassigned"}`;
        playerList.appendChild(li);
    });
}

assignRolesBtn.addEventListener("click", () => {
    // simple pairing by location
    let unmatched = [...allPlayers];
    while(unmatched.length >=2){
        for(let i=0;i<unmatched.length;i++){
            for(let j=i+1;j<unmatched.length;j++){
                if(unmatched[i].location === unmatched[j].location && !unmatched[i].role && !unmatched[j].role){
                    if(Math.random()<0.5){
                        unmatched[i].role = "finder";
                        unmatched[j].role = "hider";
                    } else{
                        unmatched[i].role = "hider";
                        unmatched[j].role = "finder";
                    }
                }
            }
        }
        break;
    }
    unmatched.forEach(p=>{if(!p.role)p.role="hider";});
    localStorage.setItem("players", JSON.stringify(allPlayers));
    renderLobby();
    lobbyStatus.textContent = "Roles assigned! Click 'Go to Finder'.";
});

// --- ASSIGN TARGET ---
function assignTarget(currentPlayer, allPlayers){
    const candidates = allPlayers.filter(p =>
        p.location===currentPlayer.location &&
        p.time===currentPlayer.time &&
        p.id!==currentPlayer.id
    );
    if(candidates.length===0) return null;
    const randomIndex = Math.floor(Math.random()*candidates.length);
    const target = candidates[randomIndex];
    return {targetId: target.id, hints: target.hints, name: target.name};
}

// --- FINDER SECTION ---
const targetHints = document.getElementById("targetHints");
const hiderList = document.getElementById("hiderList");
const finderStatus = document.getElementById("finderStatus");
const gameHistoryList = document.getElementById("gameHistory");

startGameBtn.addEventListener("click", ()=>{
    const finder = allPlayers.find(p=>p.role==="finder");
    if(!finder) return alert("No finder assigned!");
    const targetData = assignTarget(finder, allPlayers);
    if(!targetData) return alert("No target available for this finder!");
    finder.targetId = targetData.targetId;
    localStorage.setItem("players", JSON.stringify(allPlayers));

    document.getElementById("lobbySection").classList.add("hidden");
    document.getElementById("finderSection").classList.remove("hidden");

    targetHints.textContent = `Target hints: ${targetData.hints}`;
    renderHiders();
    renderGameHistory();
});

// Render hiders for finder
function renderHiders(){
    hiderList.innerHTML="";
    const finder = allPlayers.find(p=>p.role==="finder");
    const hiders = allPlayers.filter(p=>p.role==="hider" && p.location===finder.location);
    if(hiders.length===0){
        finderStatus.textContent = "No hiders available!";
        return;
    }
    hiders.forEach(h=>{
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.textContent = h.name;
        btn.addEventListener("click", ()=>{
            gameHistory.push({
                finder: finder.name,
                hider: h.name,
                location: finder.location,
                time: finder.time,
                date: new Date().toLocaleString()
            });
            localStorage.setItem("gameHistory", JSON.stringify(gameHistory));
            // remove hider
            allPlayers = allPlayers.filter(p=>p.id!==h.id);
            localStorage.setItem("players", JSON.stringify(allPlayers));
            renderHiders();
            renderGameHistory();
        });
        li.appendChild(btn);
        hiderList.appendChild(li);
    });
}

// Render game history
function renderGameHistory(){
    gameHistoryList.innerHTML="";
    gameHistory.forEach(g=>{
        const li = document.createElement("li");
        li.textContent = `${g.date} | Finder: ${g.finder} | Hider: ${g.hider} | Location: ${g.location} | Time: ${g.time}min`;
        gameHistoryList.appendChild(li);
    });
}
</script>
</body>
</html>
