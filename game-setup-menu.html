<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Game Setup</title>
  <link rel="stylesheet" href="setup.css">
</head>

<body>

  <h1>Game Setup</h1>

  <form id="gameSetupForm">
    <label for="name">Enter Player Name:</label>
    <input type="text" id="name" name="name" required placeholder="Your name">

    <label for="hints">Describe your appearance:</label>
    <textarea id="hints" name="hints" required placeholder="Clothes, color, height..."></textarea>

    <label for="location">Choose Location:</label>
    <select id="location" name="location" required>
      <option value="">--Select--</option>
      <option value="Library">Library</option>
      <option value="Cafeteria">Cafeteria</option>
      <option value="Bus Stop">Bus Stop</option>
      <option value="Campus Lawn">Campus Lawn</option>
    </select>

    <label for="time">Estimated Play Time:</label>
    <select id="time" name="time" required>
      <option value="">--Select--</option>
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
    </select>

    <button type="submit">Add Player</button>
  </form>

  <button id="goToLobby">Go to Lobby</button>
  <button id="clearPlayers">Clear All Players</button>

  <script src="game-setup-menu1.js"></script>
</body>

</html>
